//array pack
    let details = ["john", "Mariam"]

    //3. default param
    function divide(a, b = 2) {
        console.log(a / b)
    }
    divide(15)
    divide(15, 3)

    function div(a, b, rounded = false) {
        let res = a / b
        if (rounded === true) {
            return Math.round(res)
        }
        return res
    }
    let res1 = div(10, 2, true)
    let res2 = div(10, 3)
    console.log(res1, res2)

    //4. spread operator allows you to add as many nums as possible
    function betterAdd(...nums) {
        let total = 0
        for (let value of nums) {
            total += value
        }
        return total
    }
    console.log(betterAdd(10, 20, 30, 20))

//spread operator can also be used to merge  different arrays list as one or add more elements into the array
    let people = ["john", "lee", "Doe"]
    let others = ["Sammy", "Jack"]

    let merged = [...people, ...others]
    console.log(merged)
